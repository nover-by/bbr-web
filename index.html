<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bytebeat MIDI Sequencer</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎵 Bytebeat MIDI</h1>
            <p class="subtitle">Generate rhythmic patterns with bytebeat expressions</p>
        </header>

        <main class="main-grid">
            <!-- Left Column -->
            <div class="left-column">
                <!-- Code Input Section -->
                <section class="section code-section">
                    <label for="bytebeat-code">Bytebeat Expression</label>
                    <div class="code-input-wrapper">
                        <input 
                            type="text" 
                            id="bytebeat-code" 
                            value="1<<(t%8)" 
                            placeholder="Enter bytebeat expression"
                            spellcheck="false"
                        >
                    </div>
                    <div class="code-hints">
                        <span class="hint">Examples:</span>
                        <button class="hint-btn" data-code="1<<(t%8)">1&lt;&lt;(t%8)</button>
                        <button class="hint-btn" data-code="1<<(t%7)">1&lt;&lt;(t%7)</button>
                        <button class="hint-btn" data-code="(1<<(t%8))^(1<<(t%5))">(1&lt;&lt;(t%8))^(1&lt;&lt;(t%5))</button>
                        <button class="hint-btn" data-code="(1<<(t%8))|((1<<(t%5))&4)">(1&lt;&lt;(t%8))|((1&lt;&lt;(t%5))&4)</button>
                        <button class="hint-btn" data-code="(1<<(t%8))|((t>>2)&1)">(1&lt;&lt;(t%8))|((t&gt;&gt;2)&1)</button>
                    </div>
                </section>

                <!-- Transport and BPM Combined -->
                <section class="section transport-bpm-section">
                    <div class="transport-bpm-grid">
                        <div class="transport-controls-compact">
                            <button class="transport-btn stop-btn" id="stop-btn" title="Stop">
                                <svg viewBox="0 0 24 24" fill="currentColor">
                                    <rect x="6" y="6" width="12" height="12" rx="1"/>
                                </svg>
                            </button>
                            <button class="transport-btn play-btn" id="play-btn" title="Play">
                                <svg viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M8 5v14l11-7z"/>
                                </svg>
                            </button>
                            <button class="transport-btn pause-btn" id="pause-btn" title="Pause">
                                <svg viewBox="0 0 24 24" fill="currentColor">
                                    <rect x="6" y="5" width="4" height="14" rx="1"/>
                                    <rect x="14" y="5" width="4" height="14" rx="1"/>
                                </svg>
                            </button>
                        </div>
                        
                        <div class="bpm-control-compact">
                            <label for="bpm">BPM</label>
                            <div class="bpm-input-group">
                                <button class="bpm-btn" id="bpm-decrease">−</button>
                                <input type="number" id="bpm" value="120" min="20" max="300">
                                <button class="bpm-btn" id="bpm-increase">+</button>
                            </div>
                        </div>
                        
                        <div class="scale-control-compact">
                            <label for="scale-root">Root</label>
                            <input type="text" id="scale-root" value="A3" placeholder="A3">
                        </div>
                        
                        <div class="scale-mode-compact">
                            <label for="scale-mode">Scale</label>
                            <select id="scale-mode">
                                <option value="None">None</option>
                                <option value="Major">Major</option>
                                <option value="Minor">Minor</option>
                                <option value="Dorian">Dorian</option>
                                <option value="Phrygian">Phrygian</option>
                                <option value="Lydian">Lydian</option>
                                <option value="Mixolydian">Mixolydian</option>
                                <option value="Aeolian">Aeolian</option>
                                <option value="Locrian">Locrian</option>
                            </select>
                        </div>
                        
                        <div class="step-counter-compact">
                            Step: <span id="step-counter">0</span>
                        </div>
                    </div>
                </section>

                <!-- LED Visualization -->
                <section class="section led-section">
                    <label>Output <span class="bit-label">(MSB → LSB, click to edit)</span></label>
                    <div class="led-container">
                        <div class="led-wrapper" data-bit="7">
                            <div class="led" data-bit="7">
                                <span class="led-note-text">G2</span>
                                <span class="led-bit-num">7</span>
                            </div>
                        </div>
                        <div class="led-wrapper" data-bit="6">
                            <div class="led" data-bit="6">
                                <span class="led-note-text">A2</span>
                                <span class="led-bit-num">6</span>
                            </div>
                        </div>
                        <div class="led-wrapper" data-bit="5">
                            <div class="led" data-bit="5">
                                <span class="led-note-text">B2</span>
                                <span class="led-bit-num">5</span>
                            </div>
                        </div>
                        <div class="led-wrapper" data-bit="4">
                            <div class="led" data-bit="4">
                                <span class="led-note-text">C3</span>
                                <span class="led-bit-num">4</span>
                            </div>
                        </div>
                        <div class="led-wrapper" data-bit="3">
                            <div class="led" data-bit="3">
                                <span class="led-note-text">D3</span>
                                <span class="led-bit-num">3</span>
                            </div>
                        </div>
                        <div class="led-wrapper" data-bit="2">
                            <div class="led" data-bit="2">
                                <span class="led-note-text">E3</span>
                                <span class="led-bit-num">2</span>
                            </div>
                        </div>
                        <div class="led-wrapper" data-bit="1">
                            <div class="led" data-bit="1">
                                <span class="led-note-text">F3</span>
                                <span class="led-bit-num">1</span>
                            </div>
                        </div>
                        <div class="led-wrapper" data-bit="0">
                            <div class="led" data-bit="0">
                                <span class="led-note-text">A3</span>
                                <span class="led-bit-num">0</span>
                            </div>
                        </div>
                    </div>
                    <div class="current-value">
                        <span id="current-value">0</span>
                    </div>
                    
                    <!-- Inline LED Editor -->
                    <div id="led-editor-inline" class="led-editor-inline" style="display: none;">
                        <div class="led-editor-header">
                            <span class="led-editor-title">Bit <span id="inline-bit-num"></span></span>
                            <button class="led-editor-close" id="inline-close-btn">&times;</button>
                        </div>
                        <div class="led-editor-fields">
                            <div class="led-editor-field">
                                <label for="inline-note-input">Note:</label>
                                <input type="text" id="inline-note-input" placeholder="C4, 64, +3, -2">
                                <small>Name, MIDI#, or interval from LSB</small>
                            </div>
                            <div class="led-editor-field">
                                <label for="inline-velocity-input">Velocity:</label>
                                <input type="number" id="inline-velocity-input" min="0" max="127" value="100">
                            </div>
                        </div>
                    </div>
                </section>
            </div>

            <!-- Right Column -->
            <div class="right-column">
                <!-- Audio/MIDI Output Selection -->
                <section class="section output-section">
                    <label>Output</label>
                    <div class="output-mode-selector">
                        <button class="mode-btn active" id="mode-synth" data-mode="synth">
                            <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
                                <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
                            </svg>
                            Synth
                        </button>
                        <button class="mode-btn" id="mode-midi" data-mode="midi">
                            <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
                                <path d="M12 3v1M12 20v1M4 12H3M21 12h-1M5.6 5.6l-.7-.7M19.1 19.1l-.7-.7M18.4 5.6l.7-.7M4.9 19.1l.7-.7"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                            MIDI
                        </button>
                    </div>
                </section>

                <!-- Synth Section -->
                <section class="section synth-section" id="synth-section">
                    <div class="synth-header">
                        <label>Polyphonic Synthesizer</label>
                        <div class="synth-status" id="synth-status">
                            <span class="status-dot"></span>
                            <span class="status-text">Ready</span>
                        </div>
                    </div>

                    <div class="synth-controls">
                        <!-- Waveform -->
                        <div class="synth-control">
                            <label for="synth-waveform">Waveform</label>
                            <select id="synth-waveform">
                                <option value="sine">Sine</option>
                                <option value="triangle">Triangle</option>
                                <option value="sawtooth" selected>Sawtooth</option>
                                <option value="square">Square</option>
                            </select>
                        </div>

                        <!-- Master Volume -->
                        <div class="synth-control">
                            <label for="synth-volume">
                                Volume
                                <span class="control-value" id="synth-volume-value">-12 dB</span>
                            </label>
                            <input type="range" id="synth-volume" min="-40" max="0" value="-12" step="1">
                        </div>

                        <!-- Filter Frequency -->
                        <div class="synth-control">
                            <label for="synth-filter-freq">
                                Filter Cutoff
                                <span class="control-value" id="synth-filter-freq-value">2000 Hz</span>
                            </label>
                            <input type="range" id="synth-filter-freq" min="50" max="10000" value="2000" step="10">
                        </div>

                        <!-- Filter Resonance -->
                        <div class="synth-control">
                            <label for="synth-filter-res">
                                Resonance
                                <span class="control-value" id="synth-filter-res-value">1</span>
                            </label>
                            <input type="range" id="synth-filter-res" min="0.1" max="20" value="1" step="0.1">
                        </div>

                        <!-- Envelope Section -->
                        <div class="envelope-section">
                            <label>Envelope (ADSR)</label>
                            <div class="envelope-controls">
                                <div class="envelope-param">
                                    <label for="synth-attack">Attack</label>
                                    <input type="range" id="synth-attack" min="0.001" max="2" value="0.01" step="0.001">
                                    <span class="param-value" id="synth-attack-value">0.01s</span>
                                </div>
                                <div class="envelope-param">
                                    <label for="synth-decay">Decay</label>
                                    <input type="range" id="synth-decay" min="0.001" max="2" value="0.1" step="0.001">
                                    <span class="param-value" id="synth-decay-value">0.10s</span>
                                </div>
                                <div class="envelope-param">
                                    <label for="synth-sustain">Sustain</label>
                                    <input type="range" id="synth-sustain" min="0" max="1" value="0.7" step="0.01">
                                    <span class="param-value" id="synth-sustain-value">0.70</span>
                                </div>
                                <div class="envelope-param">
                                    <label for="synth-release">Release</label>
                                    <input type="range" id="synth-release" min="0.001" max="3" value="0.3" step="0.001">
                                    <span class="param-value" id="synth-release-value">0.30s</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- MIDI Configuration -->
                <section class="section midi-section" id="midi-section" style="display: none;">
                    <div class="midi-header">
                        <label>MIDI Configuration</label>
                        <div class="midi-status" id="midi-status">
                            <span class="status-dot"></span>
                            <span class="status-text">Checking...</span>
                        </div>
                    </div>
                    
                    <div class="midi-selects">
                        <div class="midi-select-row">
                            <label for="midi-output">Output:</label>
                            <select id="midi-output">
                                <option value="">Select MIDI Output...</option>
                            </select>
                        </div>

                        <div class="midi-select-row">
                            <label for="midi-channel">Channel:</label>
                            <select id="midi-channel">
                                <option value="0">1</option>
                                <option value="1">2</option>
                                <option value="2">3</option>
                                <option value="3">4</option>
                                <option value="4">5</option>
                                <option value="5">6</option>
                                <option value="6">7</option>
                                <option value="7">8</option>
                                <option value="8">9</option>
                                <option value="9">10 (Drums)</option>
                                <option value="10">11</option>
                                <option value="11">12</option>
                                <option value="12">13</option>
                                <option value="13">14</option>
                                <option value="14">15</option>
                                <option value="15">16</option>
                            </select>
                        </div>
                    </div>

                    <div class="midi-info">
                        <p class="info-text">
                            <strong>Note:</strong> Configure note mappings by clicking on the LED buttons in the Output section.
                        </p>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
